<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0f0f">
    <title>Come&Calla</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>
                <img src="assets/logo.png" alt="Come&Calla" class="logo">
            </h1>
            <div class="month-navigation">
                <button id="prevMonth" class="nav-btn">‹</button>
                <h2 id="currentMonth"></h2>
                <button id="nextMonth" class="nav-btn">›</button>
            </div>
        </header>

        <div class="calendar-container">
            <div class="calendar-header">
                <div class="day-header">Lun</div>
                <div class="day-header">Mar</div>
                <div class="day-header">Mié</div>
                <div class="day-header">Jue</div>
                <div class="day-header">Vie</div>
                <div class="day-header">Sáb</div>
                <div class="day-header">Dom</div>
            </div>
            <div id="calendar" class="calendar-grid"></div>
        </div>
        
        <div class="shopping-list-button-container">
            <button id="shoppingListBtn" class="shopping-list-btn">
                🛒 Lista de Compra
            </button>
        </div>
    </div>

    <!-- Vista de Lista de Compra -->
    <div id="shoppingListView" class="view hidden">
        <div class="view-header">
            <button id="backToCalendarBtn" class="back-view-btn">← Volver</button>
            <h2>Lista de Compra Semanal</h2>
        </div>
        <div class="shopping-list-container">
            <div id="shoppingListContent" class="shopping-list-content"></div>
        </div>
    </div>

    <!-- Modal para seleccionar recetas -->
    <div id="recipeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalDate"></h2>
                <button class="close" aria-label="Cerrar">&times;</button>
            </div>
            <div class="modal-body">
            <div class="meal-selection">
                <div class="meal-section">
                    <h3>
                        <img src="assets/icono-comida.svg" alt="Comida" class="meal-icon">
                        <span>Comida</span>
                    </h3>
                    <div id="lunchRecipes" class="recipes-list">
                        <div class="category-section">
                            <h4 class="category-header">Ensalada/Verdura</h4>
                            <div class="category-recipes-list" data-category="ensalada/verdura"></div>
                        </div>
                        <div class="category-section">
                            <h4 class="category-header">Proteína</h4>
                            <div class="category-recipes-list" data-category="proteina"></div>
                        </div>
                        <div class="category-section">
                            <h4 class="category-header">Hidratos</h4>
                            <div class="category-recipes-list" data-category="hidratos"></div>
                        </div>
                    </div>
                </div>
                <div class="meal-section">
                    <h3>
                        <img src="assets/icono-cena.svg" alt="Cena" class="meal-icon">
                        <span>Cena</span>
                    </h3>
                    <div id="dinnerRecipes" class="recipes-list">
                        <div class="category-section">
                            <h4 class="category-header">Ensalada/Verdura</h4>
                            <div class="category-recipes-list" data-category="ensalada/verdura"></div>
                        </div>
                        <div class="category-section">
                            <h4 class="category-header">Proteína</h4>
                            <div class="category-recipes-list" data-category="proteina"></div>
                        </div>
                        <div class="category-section">
                            <h4 class="category-header">Hidratos</h4>
                            <div class="category-recipes-list" data-category="hidratos"></div>
                        </div>
                    </div>
                </div>
            </div>
            </div>
        </div>
    </div>

    <!-- Modal para ver detalles de receta -->
    <div id="recipeDetailModal" class="modal">
        <div class="modal-content recipe-detail">
            <div class="modal-header">
                <button class="close-detail" aria-label="Cerrar">&times;</button>
            </div>
            <div class="modal-body">
            <div id="recipeDetailContent"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
